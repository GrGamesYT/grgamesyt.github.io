<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GR FNAF 2 - HORROR EDITION</title>
    <style>
        :root { --red-alert: #660000; --gui-green: #00ff41; }
        body { background: #000; color: #fff; margin: 0; overflow: hidden; font-family: 'Courier New', monospace; }
        
        #game-view { width: 100vw; height: 100vh; position: relative; overflow: hidden; background: #000; }

        /* EFEITO DE CÂMERA VELHA E SANGUE NAS BORDAS */
        .vignette { position: absolute; top: 0; left: 0; width: 100%; height: 100%; 
                    background: radial-gradient(circle, transparent 40%, black 120%),
                                inset 0 0 100px rgba(139, 0, 0, 0.2); 
                    z-index: 10; pointer-events: none; }
        
        .static { position: absolute; top: 0; left: 0; width: 100%; height: 100%; 
                  background: url('https://media.giphy.com/media/oEI9uWUznW3pS/giphy.gif'); 
                  opacity: 0.03; pointer-events: none; z-index: 11; }

        /* SALA E CORREDOR */
        #office { width: 100%; height: 100%; display: flex; justify-content: center; align-items: center; position: relative; }
        
        .hallway { width: 40%; height: 50%; background: #050505; border: 10px solid #111; 
                   box-shadow: 0 0 100px #000; position: relative; display: flex; justify-content: center; align-items: flex-end; }

        /* INIMIGOS */
        #foxy { width: 80%; height: auto; display: none; filter: brightness(0); transition: filter 0.1s; z-index: 5; }
        
        #bonnie-room { position: absolute; top: 0; left: 0; width: 100%; height: 100%; 
                       background: rgba(0,0,0,0.8); display: none; justify-content: center; align-items: center; z-index: 50; }
        #bonnie-room img { width: 500px; animation: breathe 4s infinite ease-in-out; }

        /* MÁSCARA E MONITOR */
        #mask-overlay { position: absolute; top: -100%; left: 0; width: 100%; height: 100%; 
                        background: radial-gradient(ellipse at center, transparent 30%, #1a0505 40%, #000 80%); 
                        z-index: 60; transition: top 0.3s cubic-bezier(0.4, 0, 0.2, 1); border: 20px solid #000; }
        
        #monitor { position: absolute; bottom: -100%; left: 0; width: 100%; height: 100%; 
                   background: #0a0a0a; z-index: 55; transition: bottom 0.3s; border: 10px solid #222; 
                   display: flex; justify-content: center; align-items: center; font-size: 2rem; color: var(--gui-green); }

        /* JUMPSCARE */
        #scare-trigger { position: absolute; top: 0; left: 0; width: 100%; height: 100%; 
                         background: #000; z-index: 1000; display: none; justify-content: center; align-items: center; }
        #scare-trigger img { width: 100%; height: 100%; object-fit: cover; animation: shake 0.05s infinite; }

        /* UI */
        #ui-top { position: absolute; top: 20px; right: 30px; text-align: right; z-index: 100; text-shadow: 2px 2px #000; }
        .battery-box { width: 120px; height: 20px; border: 2px solid #fff; margin-top: 5px; }
        #battery-level { width: 100%; height: 100%; background: #00ff00; transition: width 0.5s; }

        /* ANIMAÇÕES */
        @keyframes breathe { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.05); } }
        @keyframes shake { 0% { transform: translate(10px, 10px); } 50% { transform: translate(-10px, -10px); } }
        @keyframes flashRed { 0%, 100% { opacity: 0; } 50% { opacity: 0.3; } }

        .red-flash { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: red; pointer-events: none; z-index: 90; display: none; }

        /* CONTROLES */
        .btn-area { position: absolute; bottom: 20px; width: 250px; height: 70px; 
                    background: rgba(40, 40, 40, 0.5); border: 2px solid #555; 
                    color: #fff; display: flex; align-items: center; justify-content: center; cursor: pointer; z-index: 100; font-weight: bold; }
        .btn-area:hover { background: rgba(80, 80, 80, 0.8); }
        #mask-btn { left: 40px; }
        #monitor-btn { right: 40px; }

        #flashlight { position: absolute; top: 0; left: 0; width: 100%; height: 100%; 
                      background: radial-gradient(circle at 50% 50%, rgba(255,255,255,0.2) 0%, transparent 60%); 
                      mix-blend-mode: overlay; opacity: 0; pointer-events: none; z-index: 40; }
    </style>
</head>
<body>

<div id="start-screen" style="position:fixed; width:100%; height:100%; background:#000; z-index:9999; display:flex; flex-direction:column; justify-content:center; align-items:center; border: 10px double #330000;">
    <h1 style="color:#ff0000; font-size:4rem; margin:0; text-shadow: 0 0 20px #ff0000;">GR FNAF 2</h1>
    <p style="color:#666;">SOBREVIVA ATÉ ÀS 06:00 AM</p>
    <button onclick="initGame()" style="padding:15px 60px; background:#200; color:#f00; border:2px solid #f00; cursor:pointer; font-size:1.5rem; margin-top:30px;">ASSUMIR POSTO</button>
</div>

<div id="game-view">
    <div class="static"></div>
    <div class="vignette"></div>
    <div class="red-flash" id="alert-bg"></div>

    <div id="ui-top">
        <div id="clock" style="font-size: 2rem;">12:00 AM</div>
        <div class="battery-box"><div id="battery-level"></div></div>
        <div style="font-size: 0.8rem; color: #aaa;">POWER USAGE</div>
    </div>

    <div id="office">
        <div class="hallway">
            <img id="foxy" src="img/foxy.png" alt="CORREDOR">
        </div>
        
        <div id="bonnie-room">
            <img src="img/bonnie.png" alt="SALA">
        </div>
    </div>

    <div id="flashlight"></div>
    <div id="mask-overlay"></div>
    <div id="monitor">
        <div id="static-mon" class="static" style="opacity: 0.2;"></div>
        CÂMERAS OFFLINE
    </div>

    <div id="scare-trigger">
        <img id="scare-img" src="img/susto.gif" alt="MORTE">
    </div>

    <div id="mask-btn" class="btn-area" onmouseover="toggleMask()">MÁSCARA (M)</div>
    <div id="monitor-btn" class="btn-area" onclick="toggleMonitor()">MONITOR (TAB)</div>
</div>

<script>
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    let game = { active: false, time: 0, battery: 100, mask: false, mon: false, foxy: 0, bonnie: 0 };

    function makeDistortedSound(freq, dur, type="sawtooth") {
        const osc = audioCtx.createOscillator();
        const g = audioCtx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        g.gain.setValueAtTime(0.1, audioCtx.currentTime);
        g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
        osc.connect(g); g.connect(audioCtx.destination);
        osc.start(); osc.stop(audioCtx.currentTime + dur);
    }

    function initGame() {
        document.getElementById('start-screen').style.display = 'none';
        game.active = true;
        if(audioCtx.state === 'suspended') audioCtx.resume();
        
        // Loop de Tempo e Bateria
        setInterval(() => {
            if(!game.active) return;
            game.time++;
            updateUI();
            aiCore();
        }, 1000);
    }

    function updateUI() {
        // Relógio (6 minutos = 6 horas)
        let hour = Math.floor(game.time / 60);
        document.getElementById('clock').innerText = (hour === 0 ? 12 : hour) + ":00 AM";
        if(hour >= 6) { game.active = false; alert("VOCÊ SOBREVIVEU!"); location.reload(); }

        // Bateria
        game.battery -= (game.mon ? 0.35 : 0.12);
        document.getElementById('battery-level').style.width = game.battery + "%";
        if(game.battery <= 20) document.getElementById('alert-bg').style.display = 'block';
        if(game.battery <= 0) jumpscare();
    }

    function aiCore() {
        // Foxy avança no escuro
        if(Math.random() > 0.6) game.foxy++;
        const foxyImg = document.getElementById('foxy');
        
        if(game.foxy > 3) {
            foxyImg.style.display = 'block';
            if(game.foxy > 8 && !game.mon) jumpscare(); // Ele ataca se demorar muito
        }

        // Bonnie entra na sala
        if(Math.random() > 0.85) game.bonnie = 1;
        if(game.bonnie === 1 && !game.mon) {
            document.getElementById('bonnie-room').style.display = 'flex';
            if(!game.mask) {
                setTimeout(() => { if(!game.mask) jumpscare(); }, 3000);
            } else {
                // Se estiver de máscara, ele vai embora depois de um tempo
                setTimeout(() => { game.bonnie = 0; document.getElementById('bonnie-room').style.display = 'none'; }, 4000);
            }
        }
    }

    function toggleMask() {
        if(game.mon) return;
        game.mask = !game.mask;
        document.getElementById('mask-overlay').style.top = game.mask ? '0' : '-100%';
        makeDistortedSound(80, 0.5, "sine");
    }

    function toggleMonitor() {
        if(game.mask) return;
        game.mon = !game.mon;
        document.getElementById('monitor').style.bottom = game.mon ? '0' : '-100%';
        makeDistortedSound(400, 0.1);
    }

    function flash(on) {
        if(game.mon || !game.active) return;
        const light = document.getElementById('flashlight');
        const foxyImg = document.getElementById('foxy');
        
        if(on) {
            light.style.opacity = 1;
            foxyImg.style.filter = "brightness(1)";
            if(game.foxy > 0) game.foxy -= 1; // Espanta o Foxy aos poucos
            makeDistortedSound(150, 0.05, "square");
        } else {
            light.style.opacity = 0;
            foxyImg.style.filter = "brightness(0)";
        }
    }

    function jumpscare() {
        if(!game.active) return;
        game.active = false;
        document.getElementById('scare-trigger').style.display = 'flex';
        // Som de grito distorcido
        makeDistortedSound(200, 2, "sawtooth");
        makeDistortedSound(100, 2, "sawtooth");
        setTimeout(() => { location.reload(); }, 3500);
    }

    // Teclas: Espaço = Luz | M = Máscara | Tab = Monitor
    window.onkeydown = (e) => { 
        if(e.code === 'Space') flash(true); 
        if(e.key === 'm' || e.key === 'M') toggleMask();
    };
    window.onkeyup = (e) => { 
        if(e.code === 'Space') flash(false); 
    };
</script>

</body>
</html>
