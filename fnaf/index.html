<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>GR FNAF 2 - VIDEO SYSTEM</title>
    <style>
        :root { --fnav-red: #600; --gui-green: #0f0; }
        body { background: #000; color: #fff; margin: 0; overflow: hidden; font-family: 'Courier New', monospace; user-select: none; }

        /* AMBIENTE */
        #viewport { width: 100vw; height: 100vh; position: relative; overflow: hidden; }
        #office-wrapper { 
            width: 160vw; height: 100vh; position: absolute; left: -30vw; 
            background: radial-gradient(circle at center, #151515 0%, #000 80%);
            display: flex; align-items: center; justify-content: center;
            transition: transform 0.1s ease-out;
        }

        /* SALA E FOXY */
        .hallway { width: 500px; height: 450px; background: #050505; border: 12px solid #111; position: relative; display: flex; justify-content: center; align-items: flex-end; overflow: hidden; box-shadow: inset 0 0 100px #000;}
        #foxy { width: 350px; position: absolute; bottom: -20px; filter: brightness(0); transform: scale(0.1); transition: transform 0.3s, filter 0.1s; z-index: 5; }

        /* DUTO E BONNIE NA SALA */
        .vent { width: 220px; height: 300px; background: #020202; border: 6px solid #151515; position: absolute; bottom: 120px; border-radius: 40px 40px 0 0; }
        .vent-l { left: 80px; } .vent-r { right: 80px; }
        #bonnie-office { width: 280px; position: absolute; bottom: 50px; right: 80px; display: none; z-index: 40; filter: brightness(0.3); }

        /* MONITOR DE CÂMERAS */
        #monitor-screen { 
            position: absolute; bottom: -100%; left: 0; width: 100%; height: 100%; 
            background: #000; z-index: 150; transition: bottom 0.3s;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
        }
        #cam-content { width: 80%; height: 75%; border: 3px solid #333; position: relative; background: #050505; overflow: hidden; }
        .static { position: absolute; width: 100%; height: 100%; background: url('https://media.giphy.com/media/oEI9uWUznW3pS/giphy.gif'); opacity: 0.15; pointer-events: none; z-index: 20; }
        
        /* VIDEO E IMAGENS CAM */
        #cam-img, #bonnie-video, #duto-vazio { width: 100%; height: 100%; object-fit: cover; filter: grayscale(1) brightness(0.5); position: absolute; top: 0; left: 0; }

        /* PUPPET BOX UI */
        #puppet-ui { display: none; text-align: center; margin-top: 20px; }
        #wind-btn { padding: 15px 30px; background: #444; color: #fff; border: 2px solid #fff; cursor: pointer; border-radius: 50%; width: 100px; height: 100px; font-weight: bold; }
        #wind-btn:active { background: #888; transform: scale(0.95); }

        /* MÁSCARA */
        #mask-layer { 
            position: absolute; top: -100%; left: 0; width: 100%; height: 100%; 
            background: radial-gradient(circle at 30% 50%, transparent 10%, #000 28%), 
                        radial-gradient(circle at 70% 50%, transparent 10%, #000 28%);
            z-index: 200; transition: top 0.3s; pointer-events: none;
        }

        /* LANTERNA */
        #flashlight { position: absolute; width: 500px; height: 500px; background: radial-gradient(circle, rgba(255,255,255,0.15) 0%, transparent 70%); border-radius: 50%; pointer-events: none; z-index: 100; opacity: 0; mix-blend-mode: screen; }

        /* HUD */
        .hud { position: absolute; top: 20px; right: 30px; z-index: 210; text-align: right; }
        .battery-box { width: 120px; height: 15px; border: 2px solid #fff; margin-top: 5px; }
        #battery-fill { width: 100%; height: 100%; background: var(--gui-green); }
        #puppet-warning { color: red; font-weight: bold; animation: blink 0.5s infinite; display: none; }

        @keyframes blink { 0% { opacity: 0; } 50% { opacity: 1; } }

        .cam-btn { padding: 10px; background: #222; color: #fff; border: 1px solid #fff; cursor: pointer; margin: 5px; }
        .cam-active { background: var(--gui-green); color: #000; }

        /* SISTEMA DE MORTE */
        #jumpscare { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: #000; z-index: 1000; display: none; flex-direction: column; justify-content: center; align-items: center; }
        #jumpscare img { width: 100%; height: 100%; object-fit: cover; position: absolute; }
        #death-message { position: relative; z-index: 1001; color: red; font-size: 2.5rem; text-shadow: 2px 2px 10px black; font-weight: bold; text-transform: uppercase; background: rgba(0,0,0,0.5); padding: 10px 20px; border-radius: 10px; display: none; }

        .footer-nav { position:absolute; bottom:20px; width:100%; display:flex; justify-content:center; gap:50px; z-index: 210; }
    </style>
</head>
<body>

<div id="start-screen" style="position:fixed; width:100%; height:100%; background:#000; z-index:9999; display:flex; flex-direction:column; justify-content:center; align-items:center;">
    <h1 style="color:red; font-size:3rem;">GR FNAF 2</h1>
    <button onclick="startGame()" style="padding:20px 60px; background:#200; color:red; border:2px solid red; cursor:pointer;">INICIAR NOITE</button>
</div>

<div id="viewport" onmousemove="moveOffice(event)">
    <div id="flashlight"></div>
    
    <div id="office-wrapper">
        <div class="vent vent-l"></div>
        <div class="hallway"><img id="foxy" src="img/foxy.png"></div>
        <div class="vent vent-r"></div>
        <img id="bonnie-office" src="img/bonnie.png">
    </div>

    <div id="mask-layer"></div>

    <div id="monitor-screen">
        <div class="static"></div>
        <div id="cam-content">
            <div id="cam-label" style="position:absolute; top:10px; left:10px; color:lime; z-index:30;">CAM 01</div>
            
            <img id="cam-img" src="img/caixa.png">
            <img id="duto-vazio" src="img/duto_vazio.png" style="display:none;">
            <video id="bonnie-video" style="display:none;" loop muted playsinline>
                <source src="video/bonnie_duto.mp4" type="video/mp4">
            </video>
        </div>
        
        <div id="puppet-controls" style="margin-top:10px;">
            <button id="wind-btn" onmousedown="windMusic(true)" onmouseup="windMusic(false)" onmouseleave="windMusic(false)">WIND BOX</button>
            <div style="width:200px; height:10px; border:1px solid #fff; margin-top:10px;">
                <div id="music-bar" style="width:100%; height:100%; background:cyan;"></div>
            </div>
        </div>

        <div style="margin-top:20px;">
            <button class="cam-btn cam-active" onclick="switchCam(1)">CAM 01</button>
            <button class="cam-btn" onclick="switchCam(2)">CAM 02</button>
        </div>
    </div>

    <div class="hud">
        <div id="clock">12:00 AM</div>
        <div class="battery-box"><div id="battery-fill"></div></div>
        <div id="puppet-warning">⚠ MUSIC BOX ⚠</div>
    </div>

    <div id="jumpscare">
        <div id="death-message">MORTO POR: FOXY</div>
        <img src="img/susto.gif">
    </div>

    <div class="footer-nav">
        <button class="cam-btn" onclick="toggleMask()">MÁSCARA (M)</button>
        <button class="cam-btn" onclick="toggleMonitor()">MONITOR (TAB)</button>
    </div>
</div>

<script>
    let game = { 
        active: false, foxyDist: 0, battery: 100, mask: false, mon: false, light: false, time: 0,
        musicBox: 100, isWinding: false, currentCam: 1, bonniePos: 0 
    };

    function startGame() {
        document.getElementById('start-screen').style.display = 'none';
        game.active = true;
        setInterval(gameLoop, 1000);
    }

    function gameLoop() {
        if(!game.active) return;
        game.time++;
        
        // BATERIA
        game.battery -= (game.light ? 0.6 : 0.15);
        document.getElementById('battery-fill').style.width = game.battery + "%";
        
        // RELÓGIO
        let h = Math.floor(game.time / 60);
        document.getElementById('clock').innerText = (h === 0 ? 12 : h) + ":00 AM";

        // PUPPET
        if(!game.isWinding) game.musicBox -= 1.8;
        document.getElementById('music-bar').style.width = game.musicBox + "%";
        document.getElementById('puppet-warning').style.display = game.musicBox < 30 ? "block" : "none";
        if(game.musicBox <= 0) die("PUPPET");

        // FOXY
        if(!game.light) { if(Math.random() > 0.4) game.foxyDist += 8; }
        else { if(game.foxyDist > 0) game.foxyDist -= 18; }
        let foxyScale = 0.05 + (game.foxyDist / 80);
        document.getElementById('foxy').style.transform = `scale(${foxyScale})`;
        if(game.foxyDist > 120) die("FOXY");

        // LÓGICA DO BONNIE
        if(game.bonniePos === 0 && Math.random() > 0.85) game.bonniePos = 1; 
        else if(game.bonniePos === 1 && Math.random() > 0.7) game.bonniePos = 2; 

        if(game.bonniePos === 2) {
            document.getElementById('bonnie-office').style.display = "block";
            if(!game.mask) {
                setTimeout(() => { 
                    if(!game.mask && game.active) die("BONNIE"); 
                    else if (game.active) { 
                        game.bonniePos = 0; 
                        document.getElementById('bonnie-office').style.display="none";
                    } 
                }, 3000);
            }
        }

        updateCamView();
        if(game.battery <= 0) die("SEM ENERGIA");
    }

    function switchCam(n) {
        game.currentCam = n;
        document.querySelectorAll('.cam-btn').forEach((b, i) => b.classList.toggle('cam-active', i+1 === n));
        updateCamView();
    }

    function updateCamView() {
        const img = document.getElementById('cam-img');
        const label = document.getElementById('cam-label');
        const video = document.getElementById('bonnie-video');
        const dutoVazio = document.getElementById('duto-vazio');

        // Reset geral
        img.style.display = "none";
        video.style.display = "none";
        dutoVazio.style.display = "none";
        video.pause();

        if(game.currentCam === 1) {
            label.innerText = "CAM 01 - PRIZE CORNER";
            img.style.display = "block";
            img.src = "img/caixa.png";
        } else {
            label.innerText = "CAM 02 - RIGHT VENT";
            if(game.bonniePos === 1) {
                video.style.display = "block";
                if(game.mon) video.play(); // Só dá play se o monitor estiver aberto
            } else {
                dutoVazio.style.display = "block";
            }
        }
    }

    function windMusic(val) { game.isWinding = val; if(val && game.musicBox < 100) game.musicBox += 6; }

    function moveOffice(e) {
        if(!game.active || game.mon) return;
        const moveX = (e.clientX / window.innerWidth) * 40 - 20; 
        document.getElementById('office-wrapper').style.transform = `translateX(${-moveX}vw)`;
        const flash = document.getElementById('flashlight');
        flash.style.left = (e.clientX - 250) + 'px';
        flash.style.top = (e.clientY - 250) + 'px';
    }

    function toggleMask() {
        if(game.mon) return;
        game.mask = !game.mask;
        document.getElementById('mask-layer').style.top = game.mask ? '0' : '-100%';
    }

    function toggleMonitor() {
        if(game.mask) return;
        game.mon = !game.mon;
        document.getElementById('monitor-screen').style.bottom = game.mon ? '0' : '-100%';
        updateCamView(); // Atualiza o vídeo (play/pause) ao abrir/fechar monitor
    }

    window.onkeydown = (e) => {
        if(e.code === 'Space') { game.light = true; document.getElementById('flashlight').style.opacity = 1; document.getElementById('foxy').style.filter = "brightness(1)"; }
        if(e.key.toLowerCase() === 'm') toggleMask();
        if(e.code === 'Tab') { e.preventDefault(); toggleMonitor(); }
    };
    window.onkeyup = (e) => { if(e.code === 'Space') { game.light = false; document.getElementById('flashlight').style.opacity = 0; document.getElementById('foxy').style.filter = "brightness(0)"; }};

    function die(enemy) { 
        if(!game.active) return;
        game.active = false;
        
        const jumpscareDiv = document.getElementById('jumpscare');
        const messageDiv = document.getElementById('death-message');
        
        messageDiv.innerText = "MORTO POR: " + enemy;
        messageDiv.style.display = "block";
        jumpscareDiv.style.display = 'flex';
        
        setTimeout(() => location.reload(), 3500); 
    }
</script>
</body>
</html>
