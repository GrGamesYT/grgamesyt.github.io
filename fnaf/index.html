<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>FNAF 2 - BALANCED EDITION</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
:root{--green:#0f0; --red:#f00;}

body{
    margin:0; background:#000; color:#fff;
    font-family:'Courier New', monospace;
    overflow:hidden; user-select:none;
}

#viewport{width:100vw;height:100vh;position:relative; overflow: hidden;}

/* --- ESCRITÓRIO --- */
#office-wrapper{
    width:140vw; height:100vh;
    position:absolute; left:-20vw;
    background: linear-gradient(to bottom, #151515 0%, #050505 60%);
    display:flex; align-items:center; justify-content:center;
    transition: transform 0.1s linear;
}

/* Chão */
.floor {
    position: absolute; bottom: 0; width: 100%; height: 25%;
    background: repeating-linear-gradient(45deg, #111, #111 40px, #222 40px, #222 80px);
    transform: perspective(300px) rotateX(20deg);
    z-index: 5; border-top: 5px solid #000;
}

/* Corredor */
.hallway{
    width:400px; height:500px; background:#000;
    border:20px solid #111; border-bottom: none;
    position:relative; display:flex; justify-content:center; align-items:flex-end;
    box-shadow: inset 0 0 80px #000; z-index: 20;
}

#foxy{
    width:300px; position:absolute; bottom:0;
    filter:brightness(0); transform:scale(0.5); transition: transform 0.5s ease;
}

/* Dutos */
.vent{
    width:220px; height:280px; background:#080808;
    border:10px solid #222; position:absolute; bottom:150px;
    z-index: 15; box-shadow: inset 0 0 60px #000;
}
.vent-l{left:100px;}
.vent-r{right:100px;}

/* BONNIE */
#bonnie-office{
    width: 450px; 
    height: 600px;
    position: absolute; 
    bottom: 0; 
    right: 50px; 
    background-image: url('img/bonnie.png'); 
    background-size: contain;
    background-repeat: no-repeat;
    background-position: bottom right;
    display: none;
    z-index: 120;
    filter: brightness(0.6) contrast(1.2); /* Mais visível */
    animation: breathing 3s infinite ease-in-out;
}

@keyframes breathing {
    0% { transform: scale(1); }
    50% { transform: scale(1.02); }
    100% { transform: scale(1); }
}

/* --- MÁSCARA (VISIBILIDADE MELHORADA) --- */
#mask-layer{
    position:absolute; inset:0;
    z-index:200; pointer-events:none;
    opacity:0; transition:opacity 0.1s;
    
    /* Buracos maiores (35% de transparência inicial ao invés de 15%) */
    background: radial-gradient(circle at 30% 50%, transparent 30%, rgba(0,0,0,0.9) 55%),
                radial-gradient(circle at 70% 50%, transparent 30%, rgba(0,0,0,0.9) 55%);
    
    background-color: rgba(0,0,0,0.2); /* Fundo geral menos escuro */
}

/* --- LANTERNA --- */
#flashlight{
    position:absolute; width:600px; height:600px; border-radius:50%;
    background:radial-gradient(circle, rgba(255,255,255,0.4) 0%, transparent 60%);
    opacity:0; pointer-events:none; z-index:100; mix-blend-mode: overlay;
    transform: translate(-50%, -50%);
}

/* --- MONITOR --- */
#monitor-screen{
    position:absolute; bottom:-100%; width:100%; height:100%;
    background:#111; z-index:150; transition: bottom 0.3s;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    border-top: 10px solid #444;
}

#cam-content{
    width:85%; height:70%; border:5px solid #333; background:#000;
    position:relative; overflow:hidden;
}
.scanlines {
    position: absolute; inset: 0;
    background: repeating-linear-gradient(to bottom, transparent, transparent 2px, rgba(0,0,0,0.3) 3px);
    z-index: 50; pointer-events: none;
}
#cam-img, #duto-vazio, #bonnie-video{
    position:absolute; inset:0; width:100%; height:100%;
    object-fit:cover; filter: grayscale(1) brightness(0.7);
}

/* PUPPET */
#puppet-controls{
    position: absolute; bottom: 20px; right: 20px;
    display:flex; flex-direction:column; align-items:center;
}
.wind-btn {
    width: 90px; height: 90px; border-radius: 50%;
    border: 4px solid #fff; background: transparent; color: #fff;
    cursor: pointer; display: flex; align-items: center; justify-content: center;
    font-weight: bold;
}
.wind-btn:active { background: rgba(255,255,255,0.2); }

/* HUD */
.hud{ position:absolute; top:20px; right:30px; z-index:80; text-align:right; font-size:24px; }
.battery-box{ width:150px; height:20px; border:2px solid #fff; margin-top:5px; background:#222; }
#battery-fill{ width:100%; height:100%; background:var(--green); }

/* BOTÕES */
.footer-nav{
    position:absolute; bottom:20px; width:100%;
    display:flex; justify-content:center; gap:30px; z-index:90;
    pointer-events: none;
}
.control-btn {
    pointer-events: auto; padding: 15px 40px; background: rgba(0,0,0,0.8);
    border: 1px solid #777; color: #fff; font-family: inherit; font-size: 18px;
    cursor: pointer; text-transform: uppercase;
}
.control-btn:hover { background: #fff; color: #000; }

.map-btn { position: absolute; bottom: 30px; right: 30px; display: flex; gap: 10px; }
.cam-btn-small { padding: 10px 20px; background: #222; border: 1px solid #fff; color: #fff; cursor: pointer; }
.cam-active { background: var(--green); color: #000; font-weight: bold; }

/* TELA DE MORTE */
#jumpscare{
    position:fixed; inset:0; background:#000; z-index:999;
    display:none; flex-direction: column; align-items:center; justify-content:center;
}
#jumpscare video, #jumpscare img {
    width:100%; height:100%; object-fit:contain; position: absolute; top: 0; left: 0; z-index: 1;
}
#death-info {
    z-index: 10; position: absolute; bottom: 50px; width: 80%;
    text-align: center; background: rgba(0,0,0,0.8);
    border: 2px solid #f00; padding: 20px;
    color: #fff; font-size: 18px; display: none;
    animation: fadeIn 2s forwards;
}
#death-cause { color: #f00; font-size: 30px; margin-bottom: 10px; font-weight: bold; }
@keyframes fadeIn { from {opacity:0;} to {opacity:1;} }

</style>
</head>

<body>

<div id="viewport" onmousemove="moveOffice(event)">
    
    <div id="office-wrapper">
        <div class="vent vent-l"></div>
        <div class="hallway"><img id="foxy" src="img/foxy.png"></div>
        <div id="vent-r-element" class="vent vent-r"></div>
        <div id="bonnie-office"></div> 
        <div class="floor"></div>
    </div>

    <div id="flashlight"></div>
    <div id="mask-layer"></div>

    <div id="monitor-screen">
        <div id="cam-content">
            <div class="scanlines"></div>
            <div style="position:absolute; top:20px; left:20px; font-size:20px; z-index:60">CAM <span id="cam-num">01</span></div>
            
            <img id="cam-img" src="img/caixa.png">
            <img id="duto-vazio" src="img/duto_vazio.png" style="display:none">
            <video id="bonnie-video" loop muted playsinline style="display:none">
                <source src="video/bonnie_duto.mp4" type="video/mp4">
            </video>

            <div id="puppet-controls">
                <button class="wind-btn" onmousedown="startWind()" onmouseup="stopWind()" onmouseleave="stopWind()" ontouchstart="startWind()" ontouchend="stopWind()">WIND</button>
                <div style="width:90px;height:5px;background:#333;margin-top:5px">
                    <div id="music-bar" style="width:100%;height:100%;background:cyan"></div>
                </div>
            </div>
        </div>
        <div class="map-btn">
            <button class="cam-btn-small cam-active" onclick="switchCam(1)">CAM 01</button>
            <button class="cam-btn-small" onclick="switchCam(2)">CAM 02</button>
        </div>
    </div>

    <div class="hud">
        <div id="clock">12:00 AM</div>
        <div class="battery-box"><div id="battery-fill"></div></div>
    </div>

    <div class="footer-nav">
        <button class="control-btn" onclick="toggleMask()">MÁSCARA (M)</button>
        <button class="control-btn" onclick="toggleMonitor()">MONITOR (TAB)</button>
    </div>

    <div id="jumpscare">
        <div id="jumpscare-content"></div>
        <div id="death-info">
            <div id="death-cause">GAME OVER</div>
            <div id="death-tip"></div>
            <br><button onclick="location.reload()" style="padding:10px 20px; cursor:pointer;">TENTAR NOVAMENTE</button>
        </div>
    </div>
</div>

<script>
// CONFIGURAÇÃO DE DIFICULDADE
const game = {
    active: true, mask: false, mon: false, light: false,
    battery: 100, time: 0, hour: 0,
    
    // FOXY MAIS RÁPIDO
    foxyStage: 0,
    
    // BONNIE MAIS LENTO (Chance menor)
    bonnieLoc: 0, 
    bonniePatience: 250, 
    
    musicBox: 100, winding: false,
    currentCam: 1
};

const TIPS = {
    "FOXY": "PISQUE A LANTERNA! O Foxy está mais agressivo. Ilumine o corredor frequentemente.",
    "BONNIE": "MÁSCARA RÁPIDA! Coloque a máscara assim que o Bonnie aparecer na sala.",
    "PUPPET": "CAIXA DE MÚSICA! Não esqueça da CAM 01.",
    "BATERIA": "CUIDADO COM A ENERGIA!"
};

let loop = setInterval(gameLoop, 33);
let logic = setInterval(logicLoop, 1000);

function gameLoop(){
    if(!game.active) return;

    // Puppet
    if(game.winding) game.musicBox = Math.min(100, game.musicBox + 0.8);
    else game.musicBox -= 0.15;
    document.getElementById('music-bar').style.width = Math.max(0, game.musicBox) + "%";
    if(game.musicBox <= 0) die("PUPPET");

    // FOXY (Lógica Acelerada)
    if(game.light && !game.mask && !game.mon) {
        // Lanterna empurra Foxy de volta
        game.foxyStage = Math.max(0, game.foxyStage - 2.0);
    } else {
        // Foxy avança MUITO mais rápido agora (0.15 por frame vs 0.05 antes)
        game.foxyStage += 0.15;
    }
    
    let foxyScale = 0.5 + (game.foxyStage / 200);
    document.getElementById('foxy').style.transform = `scale(${foxyScale})`;
    
    if(game.foxyStage > 100) die("FOXY");

    // Lógica da Máscara salvando do Bonnie
    if(game.bonnieLoc === 2) {
        if(game.mask) {
            game.bonniePatience--;
            if(game.bonniePatience <= 0) {
                // Bonnie vai embora
                game.bonnieLoc = 0; 
                document.getElementById('bonnie-office').style.display = "none";
            }
        }
    }
}

function logicLoop(){
    if(!game.active) return;
    
    game.time++;
    if(game.time % 60 === 0) game.hour++;
    let dh = game.hour === 0 ? 12 : game.hour;
    document.getElementById('clock').innerText = dh + ":00 AM";
    if(game.hour === 6) { alert("6:00 AM - VENCEU!"); location.reload(); }

    let drain = 0.1;
    if(game.light) drain = 0.5;
    if(game.mon) drain = 0.3;
    game.battery -= drain;
    document.getElementById('battery-fill').style.width = game.battery + "%";
    if(game.battery <= 0) die("BATERIA");

    // IA BONNIE (Ajustada para ser menos frequente)
    // Chance diminuiu de 30% (0.7) para 8% (0.92) por segundo
    if(game.bonnieLoc === 0 && Math.random() > 0.92) {
        game.bonnieLoc = 1; // Duto
    } 
    else if(game.bonnieLoc === 1 && Math.random() > 0.6) {
        // Ataque do Bonnie
        game.bonnieLoc = 2; 
        game.bonniePatience = 4; // Segundos para ele sair se você por a mascara
        if(game.mon) toggleMonitor();
        document.getElementById('bonnie-office').style.display = "block";
        
        // Timer de Morte
        setTimeout(() => {
            // Se o Bonnie ainda está na sala, e você NÃO está de máscara, morre.
            if(game.bonnieLoc === 2 && !game.mask && game.active) {
                die("BONNIE");
            }
        }, 3500); // 3.5 segundos para reagir
    }
    updateCam();
}

function moveOffice(e){
    if(game.mon) return;
    let x = (e.clientX / window.innerWidth) - 0.5;
    document.getElementById('office-wrapper').style.transform = `translateX(${x * -30}vw)`;
    let f = document.getElementById('flashlight');
    f.style.left = e.clientX + 'px'; f.style.top = e.clientY + 'px';
}

function toggleMask(){
    if(game.mon) return;
    game.mask = !game.mask;
    document.getElementById('mask-layer').style.opacity = game.mask ? 1 : 0;
    if(game.mask) { game.light = false; document.getElementById('flashlight').style.opacity = 0; }
}

function toggleMonitor(){
    if(game.mask) return;
    game.mon = !game.mon;
    document.getElementById('monitor-screen').style.bottom = game.mon ? '0' : '-100%';
    if(game.mon) { game.light = false; document.getElementById('flashlight').style.opacity = 0; }
}

function startWind(){ game.winding = true; }
function stopWind(){ game.winding = false; }

function switchCam(n){
    game.currentCam = n;
    document.getElementById('cam-num').innerText = "0" + n;
    document.querySelectorAll('.cam-btn-small').forEach((b,i) => b.classList.toggle('cam-active', i+1 === n));
    updateCam();
}

function updateCam(){
    if(!game.mon) return;
    document.getElementById('cam-img').style.display = game.currentCam === 1 ? "block" : "none";
    document.getElementById('duto-vazio').style.display = (game.currentCam === 2 && game.bonnieLoc !== 1) ? "block" : "none";
    let vid = document.getElementById('bonnie-video');
    if(game.currentCam === 2 && game.bonnieLoc === 1){
        vid.style.display = "block"; vid.play();
    } else {
        vid.style.display = "none"; vid.pause();
    }
}

window.addEventListener('keydown', e => {
    if(e.code==="Space" && !game.mask && !game.mon){
        game.light = true; document.getElementById('flashlight').style.opacity = 1;
        document.getElementById('foxy').style.filter = "brightness(1)";
    }
    if(e.key.toLowerCase()==="m") toggleMask();
    if(e.code==="Tab") {e.preventDefault(); toggleMonitor();}
});
window.addEventListener('keyup', e => {
    if(e.code==="Space"){
        game.light = false; document.getElementById('flashlight').style.opacity = 0;
        document.getElementById('foxy').style.filter = "brightness(0)";
    }
});

function die(enemy){
    if(!game.active) return;
    game.active = false;
    let j = document.getElementById('jumpscare');
    let jc = document.getElementById('jumpscare-content');
    j.style.display = "flex";
    
    if(enemy === "BONNIE") jc.innerHTML = `<video autoplay playsinline src="video/bonnie_morte.mp4"></video>`;
    else if(enemy === "FOXY") jc.innerHTML = `<img src="img/foxy.png" style="animation:shake 0.1s infinite; transform:scale(1.2)">`;
    else jc.innerHTML = `<h1 style="color:red;font-size:80px;margin-top:20%">MORTE: ${enemy}</h1>`;

    setTimeout(() => {
        document.getElementById('death-cause').innerText = "MORTE POR: " + enemy;
        document.getElementById('death-tip').innerText = TIPS[enemy] || "";
        document.getElementById('death-info').style.display = "block";
    }, 2500);
}
</script>
</body>
</html>
