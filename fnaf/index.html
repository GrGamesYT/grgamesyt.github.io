<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GR FNAF 2 - REBORN</title>
    <style>
        :root { --fnaf-red: #600; --gui-green: #0f0; }
        body { background: #000; color: #fff; margin: 0; overflow: hidden; font-family: 'Courier New', monospace; user-select: none; }

        /* AMBIENTE */
        #viewport { width: 100vw; height: 100vh; position: relative; overflow: hidden; }
        
        #office-wrapper { 
            width: 160vw; height: 100vh; position: absolute; left: -30vw; 
            background: radial-gradient(circle at center, #111 0%, #000 70%);
            display: flex; align-items: center; justify-content: center;
            transition: transform 0.1s ease-out;
        }

        /* CORREDOR CENTRAL */
        .hallway { width: 500px; height: 450px; background: #050505; border: 12px solid #111; 
                   box-shadow: inset 0 0 100px #000; position: relative; display: flex; justify-content: center; align-items: flex-end; overflow: hidden;}

        /* FOXY (LÓGICA DE DISTÂNCIA) */
        #foxy { 
            width: 350px; height: auto; position: absolute; bottom: -20px;
            filter: brightness(0); transform: scale(0.1); /* Começa bem pequeno */
            transition: transform 0.3s ease-out, filter 0.1s; z-index: 5;
        }

        /* DUTOS LATERAIS */
        .vent { width: 220px; height: 300px; background: #020202; border: 6px solid #151515; position: absolute; bottom: 120px; border-radius: 40px 40px 0 0; }
        .vent-l { left: 80px; } .vent-r { right: 80px; }

        #bonnie-vent { width: 200px; position: absolute; bottom: 100px; right: 80px; display: none; z-index: 40; }

        /* MÁSCARA (SISTEMA DE CAMADAS) */
        #mask-layer { 
            position: absolute; top: -100%; left: 0; width: 100%; height: 100%; 
            background: radial-gradient(circle at 30% 50%, transparent 10%, #000 25%), 
                        radial-gradient(circle at 70% 50%, transparent 10%, #000 25%);
            z-index: 200; transition: top 0.3s cubic-bezier(0.4, 0, 0.2, 1); pointer-events: none;
        }

        /* MONITOR DE CÂMERAS */
        #monitor-screen { 
            position: absolute; bottom: -100%; left: 0; width: 100%; height: 100%; 
            background: #000; z-index: 150; transition: bottom 0.3s;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
        }
        .static { position: absolute; width: 100%; height: 100%; background: url('https://media.giphy.com/media/oEI9uWUznW3pS/giphy.gif'); opacity: 0.1; pointer-events: none; }
        #cam-view { width: 80%; height: 70%; border: 2px solid var(--gui-green); background: #050505; position: relative; }

        /* LANTERNA */
        #flashlight { 
            position: absolute; width: 500px; height: 500px; 
            background: radial-gradient(circle, rgba(255,255,255,0.15) 0%, transparent 70%);
            border-radius: 50%; pointer-events: none; z-index: 100; opacity: 0; mix-blend-mode: screen;
        }

        /* UI */
        .ui-panel { position: absolute; top: 20px; right: 30px; z-index: 210; text-align: right; }
        .battery-bar { width: 120px; height: 15px; border: 2px solid #fff; margin-top: 5px; }
        #battery-fill { width: 100%; height: 100%; background: var(--gui-green); transition: width 0.3s; }

        /* BOTÕES */
        .footer-btns { position: absolute; bottom: 20px; width: 100%; display: flex; justify-content: space-around; z-index: 220; }
        .btn { padding: 15px 40px; background: rgba(30,30,30,0.8); border: 2px solid #555; color: #fff; cursor: pointer; font-weight: bold; }
        .btn:hover { background: #444; }

        #jumpscare { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: #000; z-index: 1000; display: none; }
        #jumpscare img { width: 100%; height: 100%; object-fit: cover; }
    </style>
</head>
<body>

<div id="start-screen" style="position:fixed; width:100%; height:100%; background:#000; z-index:9999; display:flex; flex-direction:column; justify-content:center; align-items:center;">
    <h1 style="color:red; font-size:3rem; text-shadow: 0 0 20px red;">GR FNAF 2</h1>
    <button onclick="startGame()" style="padding:20px 60px; background:#200; color:red; border:2px solid red; cursor:pointer; font-weight:bold;">VIGIAR NOITE</button>
</div>

<div id="viewport" onmousemove="moveOffice(event)">
    <div id="flashlight"></div>
    
    <div id="office-wrapper">
        <div class="vent vent-l"></div>
        <div class="hallway">
            <img id="foxy" src="img/foxy.png">
        </div>
        <div class="vent vent-r"></div>
        <img id="bonnie-vent" src="img/bonnie.png">
    </div>

    <div id="mask-layer"></div>

    <div id="monitor-screen">
        <div class="static"></div>
        <h2 style="color:var(--gui-green); position:absolute; top:20px; left:50px;">CAM 01 - AREA EXTERNA</h2>
        <div id="cam-view"></div>
        <button class="btn" style="margin-top:20px;" onclick="toggleMonitor()">FECHAR MONITOR</button>
    </div>

    <div class="ui-panel">
        <div id="clock" style="font-size:2.5rem;">12:00 AM</div>
        <div class="battery-bar"><div id="battery-fill"></div></div>
    </div>

    <div class="footer-btns">
        <div class="btn" onclick="toggleMask()">MÁSCARA (M)</div>
        <div class="btn" onclick="toggleMonitor()">MONITOR (TAB)</div>
    </div>

    <div id="jumpscare"><img src="img/susto.gif"></div>
</div>

<script>
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    let game = { active: false, foxyDist: 0, battery: 100, mask: false, mon: false, light: false, time: 0 };

    function startGame() {
        document.getElementById('start-screen').style.display = 'none';
        game.active = true;
        if(audioCtx.state === 'suspended') audioCtx.resume();
        
        setInterval(loop, 1000);
    }

    function loop() {
        if(!game.active) return;
        game.time++;
        game.battery -= (game.light ? 0.5 : 0.1);
        updateUI();

        // LÓGICA DO FOXY
        const foxyEl = document.getElementById('foxy');
        
        if(game.light) {
            // Se a luz estiver ligada, ele recua MUITO (distância diminui)
            if(game.foxyDist > 0) game.foxyDist -= 15; 
        } else {
            // No escuro ele avança
            if(Math.random() > 0.4) game.foxyDist += 8;
        }

        // Limita a distância mínima em 0
        if(game.foxyDist < 0) game.foxyDist = 0;

        // Aplica o tamanho baseado na distância (0 a 100)
        // Escala vai de 0.1 (longe) até 1.5 (na sua cara)
        let scaleVal = 0.1 + (game.foxyDist / 80);
        foxyEl.style.transform = `scale(${scaleVal})`;

        if(game.foxyDist > 110) die(); // ATAQUE!
    }

    function moveOffice(e) {
        if(!game.active || game.mon) return;
        const rect = document.getElementById('viewport').getBoundingClientRect();
        const x = e.clientX - rect.left;
        const y = e.clientY - rect.top;

        // PANORAMA
        const moveX = (e.clientX / window.innerWidth) * 40 - 20; 
        document.getElementById('office-wrapper').style.transform = `translateX(${-moveX}vw)`;

        // LANTERNA SEGUE MOUSE
        const flash = document.getElementById('flashlight');
        flash.style.left = (e.clientX - 250) + 'px';
        flash.style.top = (e.clientY - 250) + 'px';
    }

    function toggleMask() {
        if(game.mon) return; // Não pode por máscara com monitor aberto
        game.mask = !game.mask;
        document.getElementById('mask-layer').style.top = game.mask ? '0' : '-100%';
        if(game.mask) playSound(120, 0.5);
    }

    function toggleMonitor() {
        if(game.mask) return; // Não pode abrir monitor de máscara
        game.mon = !game.mon;
        document.getElementById('monitor-screen').style.bottom = game.mon ? '0' : '-100%';
        playSound(600, 0.1);
    }

    // TECLAS
    window.onkeydown = (e) => {
        if(e.code === 'Space') {
            game.light = true;
            document.getElementById('flashlight').style.opacity = 1;
            document.getElementById('foxy').style.filter = "brightness(1)";
        }
        if(e.key.toLowerCase() === 'm') toggleMask();
        if(e.code === 'Tab') { e.preventDefault(); toggleMonitor(); }
    };

    window.onkeyup = (e) => {
        if(e.code === 'Space') {
            game.light = false;
            document.getElementById('flashlight').style.opacity = 0;
            document.getElementById('foxy').style.filter = "brightness(0)";
        }
    };

    function updateUI() {
        let h = Math.floor(game.time / 60);
        document.getElementById('clock').innerText = (h === 0 ? 12 : h) + ":00 AM";
        document.getElementById('battery-fill').style.width = game.battery + "%";
        if(game.battery <= 0) die();
    }

    function playSound(f, d) {
        const osc = audioCtx.createOscillator();
        const g = audioCtx.createGain();
        osc.frequency.value = f;
        g.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + d);
        osc.connect(g); g.connect(audioCtx.destination);
        osc.start(); osc.stop(audioCtx.currentTime + d);
    }

    function die() {
        game.active = false;
        document.getElementById('jumpscare').style.display = 'block';
        setTimeout(() => location.reload(), 3000);
    }
</script>
</body>
</html>
