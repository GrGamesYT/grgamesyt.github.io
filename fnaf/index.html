<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>GR FNAF 2 - MASK FIX</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
:root { --gui-green:#0f0; }

body{
    margin:0;
    background:#000;
    color:#fff;
    font-family:'Courier New', monospace;
    overflow:hidden;
    user-select:none;
}

#viewport{width:100vw;height:100vh;position:relative}

/* ESCRITÓRIO */
#office-wrapper{
    width:160vw;height:100vh;
    position:absolute;left:-30vw;
    background:radial-gradient(circle,#151515 0%,#000 80%);
    display:flex;align-items:center;justify-content:center;
    transition:transform .1s
}

.hallway{
    width:500px;height:450px;
    background:#050505;
    border:12px solid #111;
    display:flex;justify-content:center;align-items:flex-end;
    overflow:hidden;position:relative
}

#foxy{
    width:350px;
    position:absolute;
    bottom:-20px;
    filter:brightness(0);
    transform:scale(.1);
    transition:.2s;
}

.vent{
    width:220px;height:300px;
    background:#020202;
    border:6px solid #151515;
    position:absolute;bottom:120px;
    border-radius:40px 40px 0 0
}
.vent-l{left:80px}
.vent-r{right:80px}

#bonnie-office{
    width:280px;
    position:absolute;
    bottom:50px;right:80px;
    display:none;
    filter:brightness(.4);
    z-index:40
}

/* LANTERNA */
#flashlight{
    position:absolute;
    width:500px;height:500px;
    border-radius:50%;
    background:radial-gradient(circle,rgba(255,255,255,.2) 0%,transparent 70%);
    opacity:0;pointer-events:none;
    z-index:90;
    mix-blend-mode:screen
}

/* MÁSCARA FIXADA */
#mask-layer{
    position:absolute;
    inset:0;
    background:rgba(0,0,0,.85);
    z-index:200;
    pointer-events:none;
    opacity:0;
    transition:opacity .2s;
}

/* olhos */
.mask-eye{
    position:absolute;
    top:50%;
    width:280px;height:340px;
    border-radius:50%;
    background:rgba(0,0,0,.15);
    backdrop-filter:brightness(1.25);
    transform:translateY(-50%);
}
.mask-eye.left{left:18%}
.mask-eye.right{right:18%}

/* vinheta */
#mask-layer::after{
    content:'';
    position:absolute;
    inset:0;
    background:radial-gradient(circle,transparent 40%,rgba(0,0,0,.7) 80%);
}

/* HUD */
.hud{position:absolute;top:20px;right:30px;z-index:80;text-align:right}
.battery-box{width:120px;height:15px;border:2px solid #fff}
#battery-fill{width:100%;height:100%;background:var(--gui-green)}

/* MONITOR */
#monitor-screen{
    position:absolute;
    bottom:-100%;
    width:100%;height:100%;
    background:#000;
    z-index:150;
    transition:.3s;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center
}

#cam-content{
    width:80%;height:70%;
    border:3px solid #333;
    background:#050505;
    position:relative;
    overflow:hidden
}

.static{
    position:absolute;inset:0;
    background:url('https://media.giphy.com/media/oEI9uWUznW3pS/giphy.gif');
    opacity:.15;z-index:20
}

#cam-img,#duto-vazio,#bonnie-video{
    position:absolute;
    inset:0;
    width:100%;height:100%;
    object-fit:cover;
    filter:grayscale(1) brightness(.5)
}

/* BOTÕES */
.footer-nav{
    position:absolute;
    bottom:20px;
    width:100%;
    display:flex;
    justify-content:center;
    gap:40px;
    z-index:60
}

.cam-btn{
    padding:10px 30px;
    border:1px solid #fff;
    background:#222;
    color:#fff;
    cursor:pointer;
    border-radius:20px
}
.cam-active{background:var(--gui-green);color:#000}

/* JUMPSCARE */
#jumpscare{
    position:fixed;
    inset:0;
    background:#000;
    z-index:999;
    display:none;
    align-items:center;
    justify-content:center
}
#jumpscare-media{
    width:100%;height:100%;
    object-fit:cover;
}
</style>
</head>

<body>

<div id="viewport" onmousemove="moveOffice(event)">
<div id="flashlight"></div>

<div id="office-wrapper">
    <div class="vent vent-l"></div>
    <div class="hallway"><img id="foxy" src="img/foxy.png"></div>
    <div class="vent vent-r"></div>
    <img id="bonnie-office" src="img/bonnie.png">
</div>

<div id="mask-layer">
    <div class="mask-eye left"></div>
    <div class="mask-eye right"></div>
</div>

<div id="monitor-screen">
    <div class="static"></div>
    <div id="cam-content">
        <img id="cam-img" src="img/caixa.png">
        <img id="duto-vazio" src="img/duto_vazio.png" style="display:none">
        <video id="bonnie-video" loop muted playsinline style="display:none">
            <source src="video/bonnie_duto.mp4" type="video/mp4">
        </video>
    </div>
    <div style="margin-top:15px">
        <button class="cam-btn cam-active" onclick="switchCam(1)">CAM 01</button>
        <button class="cam-btn" onclick="switchCam(2)">CAM 02</button>
    </div>
</div>

<div class="hud">
    <div id="clock">12:00 AM</div>
    <div class="battery-box"><div id="battery-fill"></div></div>
</div>

<div class="footer-nav">
    <button class="cam-btn" onclick="toggleMask()">MÁSCARA (M)</button>
    <button class="cam-btn" onclick="toggleMonitor()">MONITOR (TAB)</button>
</div>

<div id="jumpscare">
    <img id="jumpscare-media">
</div>

</div>

<script>
let game={
    active:true,mask:false,mon:false,light:false,
    battery:100,time:0,foxyDist:0,
    bonniePos:0,currentCam:1
};

setInterval(gameLoop,1000);

function gameLoop(){
    game.time++;
    game.battery-=game.light?.6:.15;
    document.getElementById('battery-fill').style.width=Math.max(0,game.battery)+"%";
    document.getElementById('clock').innerText=(game.time/60<1?12:Math.floor(game.time/60))+":00 AM";

    if(!game.light)game.foxyDist+=Math.random()*8;
    else game.foxyDist=Math.max(0,game.foxyDist-20);

    document.getElementById('foxy').style.transform=`scale(${.05+game.foxyDist/80})`;
    if(game.foxyDist>120)die();

    if(game.bonniePos===0&&Math.random()>.9)game.bonniePos=1;
    else if(game.bonniePos===1&&Math.random()>.8)game.bonniePos=2;

    if(game.bonniePos===2){
        document.getElementById('bonnie-office').style.display="block";
        if(!game.mask)setTimeout(()=>die(),2500);
        else setTimeout(()=>{
            game.bonniePos=0;
            document.getElementById('bonnie-office').style.display="none";
        },3500);
    }

    updateCam();
}

function toggleMask(){
    if(game.mon)return;
    game.mask=!game.mask;
    document.getElementById('mask-layer').style.opacity=game.mask?1:0;
    if(game.mask){game.light=false;document.getElementById('flashlight').style.opacity=0}
}

function toggleMonitor(){
    if(game.mask)return;
    game.mon=!game.mon;
    document.getElementById('monitor-screen').style.bottom=game.mon?0:'-100%';
    updateCam();
}

function switchCam(n){
    game.currentCam=n;
    document.querySelectorAll('.cam-btn').forEach((b,i)=>b.classList.toggle('cam-active',i+1===n));
    updateCam();
}

function updateCam(){
    document.getElementById('cam-img').style.display=game.currentCam===1?"block":"none";
    document.getElementById('duto-vazio').style.display=(game.currentCam===2&&game.bonniePos!==1)?"block":"none";
    document.getElementById('bonnie-video').style.display=(game.currentCam===2&&game.bonniePos===1)?"block":"none";
}

function moveOffice(e){
    if(game.mon)return;
    let x=(e.clientX/window.innerWidth)*40-20;
    document.getElementById('office-wrapper').style.transform=`translateX(${-x}vw)`;
    let f=document.getElementById('flashlight');
    f.style.left=e.clientX-250+'px';
    f.style.top=e.clientY-250+'px';
}

window.onkeydown=e=>{
    if(e.code==='Space'&&!game.mask){
        game.light=true;
        document.getElementById('flashlight').style.opacity=1;
        document.getElementById('foxy').style.filter="brightness(1)";
    }
    if(e.key.toLowerCase()==='m')toggleMask();
    if(e.code==='Tab'){e.preventDefault();toggleMonitor();}
};

window.onkeyup=e=>{
    if(e.code==='Space'){
        game.light=false;
        document.getElementById('flashlight').style.opacity=0;
        document.getElementById('foxy').style.filter="brightness(0)";
    }
};

function die(){
    document.getElementById('jumpscare').style.display="flex";
    document.getElementById('jumpscare-media').src="https://media.giphy.com/media/oEI9uWUznW3pS/giphy.gif";
    setTimeout(()=>location.reload(),4000);
}
</script>

</body>
</html>
