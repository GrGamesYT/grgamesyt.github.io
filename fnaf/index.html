<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GR FNAF 2 - PRO EDITION</title>
    <style>
        :root { --fnaf-red: #4a0000; --monitor-bg: rgba(0, 20, 0, 0.9); }
        body { background: #000; color: #fff; margin: 0; overflow: hidden; font-family: 'Courier New', monospace; }

        /* JANELA DO JOGO */
        #viewport { width: 100vw; height: 100vh; position: relative; overflow: hidden; cursor: none; }

        /* SALA PANORÂMICA (Mais larga que a tela para poder girar) */
        #office-wrapper { 
            width: 150vw; height: 100vh; position: absolute; left: -25vw; 
            display: flex; align-items: center; justify-content: center;
            background: linear-gradient(to bottom, #0a0a0a, #000);
            transition: transform 0.1s ease-out;
        }

        /* PAREDE CENTRAL (CORREDOR DO FOXY) */
        .wall-center { width: 600px; height: 500px; background: #050505; border: 15px solid #111; 
                       box-shadow: inset 0 0 150px #000; display: flex; justify-content: center; align-items: flex-end; position: relative; }

        /* DUTOS LATERAIS */
        .vent { width: 250px; height: 350px; background: #030303; border: 8px solid #111; position: absolute; bottom: 100px; }
        .vent-left { left: 50px; border-radius: 50px 50px 0 0; }
        .vent-right { right: 50px; border-radius: 50px 50px 0 0; }

        /* MESA E MONITOR NO MEIO */
        #desk { position: absolute; bottom: 0; width: 800px; height: 200px; background: #1a1a1a; 
                border-top: 10px solid #222; z-index: 50; box-shadow: 0 -20px 50px #000; }

        /* INIMIGOS COM TAMANHO CONTROLADO */
        #foxy { width: 300px; height: auto; position: absolute; bottom: 0; display: block; 
                filter: brightness(0); transition: filter 0.1s, transform 0.5s ease-in; z-index: 5; }
        
        #bonnie-vent { 
            width: 100px; height: auto; position: absolute; bottom: 50px; right: 120px; 
            display: none; transition: all 0.5s ease-out; z-index: 45; opacity: 0.5;
        }

        /* EFEITOS DE MÁSCARA (Ajustado com os buracos de visão) */
        #mask-layer { 
            position: absolute; top: -100%; left: 0; width: 100%; height: 100%; 
            background: radial-gradient(circle at 35% 50%, transparent 12%, #000 20%), 
                        radial-gradient(circle at 65% 50%, transparent 12%, #000 20%);
            z-index: 100; transition: top 0.2s; pointer-events: none; opacity: 0.95;
        }

        /* LANTERNA */
        #flashlight { 
            position: absolute; width: 400px; height: 400px; 
            background: radial-gradient(circle, rgba(255,255,255,0.2) 0%, transparent 70%);
            border-radius: 50%; pointer-events: none; z-index: 80; opacity: 0; mix-blend-mode: screen;
        }

        /* UI */
        .hud { position: absolute; top: 20px; right: 30px; z-index: 110; text-align: right; }
        .btn-ui { position: absolute; bottom: 20px; width: 300px; height: 60px; background: rgba(50,50,50,0.4); 
                  border: 2px solid #444; color: #fff; display: flex; align-items: center; justify-content: center; z-index: 120; cursor: pointer; }

        /* JUMPSCARE */
        #jumpscare { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: #000; 
                     z-index: 1000; display: none; justify-content: center; align-items: center; }
        #jumpscare img { width: 100%; height: 100%; object-fit: cover; animation: shake 0.05s infinite; }

        @keyframes shake { 0% { transform: translate(5px, 5px); } 50% { transform: translate(-5px, -5px); } }
        @keyframes breathe { 0%, 100% { transform: scale(1); opacity: 0.8; } 50% { transform: scale(1.02); opacity: 1; } }
    </style>
</head>
<body>

<div id="start-screen" style="position:fixed; width:100%; height:100%; background:#000; z-index:9999; display:flex; flex-direction:column; justify-content:center; align-items:center;">
    <h1 style="color:red; font-size:3rem;">GR FNAF 2: PRO</h1>
    <button onclick="startGame()" style="padding:20px 60px; background:red; color:white; border:none; cursor:pointer;">INICIAR NOITE</button>
</div>

<div id="viewport" onmousemove="handleInput(event)">
    <div id="flashlight"></div>
    
    <div id="office-wrapper">
        <div class="vent vent-left"></div>
        
        <div class="wall-center">
            <img id="foxy" src="img/foxy.png">
        </div>

        <img id="bonnie-vent" src="img/bonnie.png">
        <div class="vent vent-right"></div>
        
        <div id="desk"></div>
    </div>

    <div id="mask-layer"></div>

    <div class="hud">
        <div id="clock" style="font-size:2rem;">12:00 AM</div>
        <div style="width:100px; height:10px; border:1px solid #fff; margin-top:5px;">
            <div id="battery" style="width:100%; height:100%; background:#0f0;"></div>
        </div>
    </div>

    <div id="jumpscare"><img src="img/susto.gif"></div>

    <div style="left: 50px;" class="btn-ui" onmouseover="toggleMask()">MÁSCARA (M)</div>
    <div style="right: 50px;" class="btn-ui" onclick="toggleMonitor()">MONITOR (TAB)</div>
</div>

<script>
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    let state = { active: false, foxyPos: 0, bonniePos: 0, battery: 100, mask: false, light: false, time: 0 };
    let breathingInterval;

    // RESPIRAÇÃO REALISTA (Via Código)
    function playBreathing(active) {
        if(active) {
            breathingInterval = setInterval(() => {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(60, audioCtx.currentTime);
                gain.gain.setValueAtTime(0, audioCtx.currentTime);
                gain.gain.linearRampToValueAtTime(0.05, audioCtx.currentTime + 0.5);
                gain.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 1.2);
                osc.connect(gain); gain.connect(audioCtx.destination);
                osc.start(); osc.stop(audioCtx.currentTime + 1.2);
            }, 2000);
        } else { clearInterval(breathingInterval); }
    }

    function startGame() {
        document.getElementById('start-screen').style.display = 'none';
        state.active = true;
        if(audioCtx.state === 'suspended') audioCtx.resume();
        
        setInterval(() => {
            if(!state.active) return;
            gameLoop();
        }, 1000);
    }

    function gameLoop() {
        state.time++;
        state.battery -= (state.light ? 0.4 : 0.1);
        updateUI();

        // LÓGICA DO FOXY (O mestre do corredor)
        if(Math.random() > 0.5) state.foxyPos += 10; // Avança
        
        const foxyEl = document.getElementById('foxy');
        foxyEl.style.transform = `scale(${1 + state.foxyPos/100})`;
        
        if(state.light && state.foxyPos > 0) {
            state.foxyPos -= 15; // Recua com a luz
        }

        if(state.foxyPos > 150) die(); // Foxy pulou!

        // LÓGICA DO BONNIE (Saindo do duto direito)
        if(state.time % 20 === 0) state.bonniePos = 1;
        
        const bonnie = document.getElementById('bonnie-vent');
        if(state.bonniePos === 1) {
            bonnie.style.display = 'block';
            bonnie.style.width = "250px"; // Ele cresce
            bonnie.style.right = "50px";  // Ele sai do duto
            bonnie.style.opacity = "1";
            
            setTimeout(() => {
                if(!state.mask && state.bonniePos === 1) die();
                else { state.bonniePos = 0; bonnie.style.display = 'none'; }
            }, 4000);
        }
    }

    function handleInput(e) {
        if(!state.active) return;
        
        // MOVIMENTAÇÃO DA VISÃO (PAN)
        const percentX = e.clientX / window.innerWidth;
        const moveX = (percentX * 50) - 25; // Move entre -25vw e 25vw
        document.getElementById('office-wrapper').style.transform = `translateX(${-moveX}vw)`;

        // POSIÇÃO DA LANTERNA
        const flash = document.getElementById('flashlight');
        flash.style.left = (e.clientX - 200) + 'px';
        flash.style.top = (e.clientY - 200) + 'px';
    }

    function toggleMask() {
        state.mask = !state.mask;
        document.getElementById('mask-layer').style.top = state.mask ? '0' : '-100%';
        playBreathing(state.mask);
    }

    window.onkeydown = (e) => {
        if(e.code === 'Space') {
            state.light = true;
            document.getElementById('flashlight').style.opacity = 1;
            document.getElementById('foxy').style.filter = "brightness(1)";
        }
    };
    window.onkeyup = (e) => {
        if(e.code === 'Space') {
            state.light = false;
            document.getElementById('flashlight').style.opacity = 0;
            document.getElementById('foxy').style.filter = "brightness(0)";
        }
    };

    function updateUI() {
        let h = Math.floor(state.time / 60);
        document.getElementById('clock').innerText = (h === 0 ? 12 : h) + ":00 AM";
        document.getElementById('battery').style.width = state.battery + "%";
        if(state.battery <= 0) die();
    }

    function die() {
        state.active = false;
        document.getElementById('jumpscare').style.display = 'flex';
        setTimeout(() => location.reload(), 3000);
    }
</script>
</body>
</html>
