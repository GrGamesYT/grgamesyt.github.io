<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>GR FNAF 2 – PERFECT MASK FIX</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
:root{--green:#0f0}

body{
    margin:0;
    background:#000;
    color:#fff;
    font-family:Courier New, monospace;
    overflow:hidden;
    user-select:none
}

#viewport{width:100vw;height:100vh;position:relative}

/* ESCRITÓRIO */
#office-wrapper{
    width:160vw;height:100vh;
    position:absolute;left:-30vw;
    background:radial-gradient(circle,#1c1c1c 0%,#000 75%);
    display:flex;align-items:center;justify-content:center;
    transition:.1s
}

.hallway{
    width:500px;height:450px;
    background:#050505;
    border:12px solid #111;
    position:relative;
    display:flex;
    justify-content:center;
    align-items:flex-end;
    overflow:hidden
}

#foxy{
    width:350px;
    position:absolute;
    bottom:-20px;
    filter:brightness(0);
    transform:scale(.1);
    transition:.25s
}

.vent{
    width:220px;height:300px;
    background:#020202;
    border:6px solid #151515;
    position:absolute;
    bottom:120px;
    border-radius:40px 40px 0 0
}
.vent-l{left:80px}
.vent-r{right:80px}

#bonnie-office{
    width:280px;
    position:absolute;
    bottom:50px;
    right:80px;
    display:none;
    filter:brightness(.5);
    z-index:40
}

/* LANTERNA */
#flashlight{
    position:absolute;
    width:520px;
    height:520px;
    border-radius:50%;
    background:radial-gradient(circle,
        rgba(255,255,255,.35) 0%,
        rgba(255,255,255,.15) 35%,
        transparent 70%);
    opacity:0;
    pointer-events:none;
    z-index:90;
    mix-blend-mode:screen
}

/* ===== MÁSCARA – VISÃO PERFEITA ===== */
#mask-layer{
    position:absolute;
    inset:0;
    background:rgba(0,0,0,.65);
    z-index:200;
    pointer-events:none;
    opacity:0;
    transition:.15s
}

.mask-eye{
    position:absolute;
    top:50%;
    width:320px;
    height:380px;
    border-radius:50%;
    transform:translateY(-50%);
    background:radial-gradient(circle,
        rgba(255,255,255,.7) 0%,
        rgba(255,255,255,.35) 40%,
        rgba(0,0,0,.25) 75%
    );
    box-shadow:
        0 0 80px rgba(255,255,255,.55),
        inset 0 0 40px rgba(255,255,255,.35);
    backdrop-filter:brightness(1.35)
}

.mask-eye.left{left:15%}
.mask-eye.right{right:15%}

#mask-layer::after{
    content:'';
    position:absolute;
    inset:0;
    background:radial-gradient(circle,transparent 50%,rgba(0,0,0,.7) 85%)
}

/* HUD */
.hud{
    position:absolute;
    top:20px;
    right:30px;
    z-index:80;
    text-align:right
}
.battery-box{
    width:120px;
    height:15px;
    border:2px solid #fff
}
#battery-fill{
    width:100%;
    height:100%;
    background:var(--green)
}

/* MONITOR */
#monitor-screen{
    position:absolute;
    bottom:-100%;
    width:100%;
    height:100%;
    background:#000;
    z-index:150;
    transition:.3s;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center
}

#cam-content{
    width:80%;
    height:70%;
    border:3px solid #333;
    background:#050505;
    position:relative;
    overflow:hidden
}

.static{
    position:absolute;
    inset:0;
    background:url('https://media.giphy.com/media/oEI9uWUznW3pS/giphy.gif');
    opacity:.15;
    z-index:20
}

#cam-img,#duto-vazio,#bonnie-video{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    object-fit:cover;
    filter:grayscale(1) brightness(.6)
}

/* PUPPET */
#puppet-controls{margin-top:10px}

/* BOTÕES */
.footer-nav{
    position:absolute;
    bottom:20px;
    width:100%;
    display:flex;
    justify-content:center;
    gap:40px;
    z-index:60
}

.cam-btn{
    padding:10px 30px;
    border:1px solid #fff;
    background:#222;
    color:#fff;
    cursor:pointer;
    border-radius:20px
}
.cam-active{background:var(--green);color:#000}

/* JUMPSCARE */
#jumpscare{
    position:fixed;
    inset:0;
    background:#000;
    z-index:999;
    display:none;
    align-items:center;
    justify-content:center
}
#jumpscare video,#jumpscare img{
    width:100%;
    height:100%;
    object-fit:cover
}
</style>
</head>

<body>

<div id="viewport" onmousemove="moveOffice(event)">
<div id="flashlight"></div>

<div id="office-wrapper">
    <div class="vent vent-l"></div>
    <div class="hallway"><img id="foxy" src="img/foxy.png"></div>
    <div class="vent vent-r"></div>
    <img id="bonnie-office" src="img/bonnie.png">
</div>

<div id="mask-layer">
    <div class="mask-eye left"></div>
    <div class="mask-eye right"></div>
</div>

<div id="monitor-screen">
    <div class="static"></div>
    <div id="cam-content">
        <img id="cam-img" src="img/caixa.png">
        <img id="duto-vazio" src="img/duto_vazio.png" style="display:none">
        <video id="bonnie-video" loop muted playsinline style="display:none">
            <source src="video/bonnie_duto.mp4" type="video/mp4">
        </video>
    </div>

    <div id="puppet-controls">
        <button class="cam-btn"
            onmousedown="windMusic(true)"
            onmouseup="windMusic(false)"
            onmouseleave="windMusic(false)">
            WIND BOX
        </button>
        <div style="width:200px;height:10px;border:1px solid #fff;margin-top:5px">
            <div id="music-bar" style="width:100%;height:100%;background:cyan"></div>
        </div>
    </div>

    <div style="margin-top:15px">
        <button class="cam-btn cam-active" onclick="switchCam(1)">CAM 01</button>
        <button class="cam-btn" onclick="switchCam(2)">CAM 02</button>
    </div>
</div>

<div class="hud">
    <div id="clock">12:00 AM</div>
    <div class="battery-box"><div id="battery-fill"></div></div>
</div>

<div class="footer-nav">
    <button class="cam-btn" onclick="toggleMask()">MÁSCARA (M)</button>
    <button class="cam-btn" onclick="toggleMonitor()">MONITOR (TAB)</button>
</div>

<div id="jumpscare"></div>

</div>

<script>
let game={
    active:true,
    mask:false,
    mon:false,
    light:false,
    battery:100,
    time:0,
    foxyDist:0,
    bonniePos:0,
    bonnieAttacking:false,
    currentCam:1,
    musicBox:100,
    winding:false
};

setInterval(gameLoop,1000);

function gameLoop(){
    if(!game.active)return;

    game.time++;
    game.battery-=game.light?.6:.15;
    document.getElementById('battery-fill').style.width=Math.max(0,game.battery)+"%";
    document.getElementById('clock').innerText=(game.time/60<1?12:Math.floor(game.time/60))+":00 AM";

    if(game.mon){
        if(!game.winding)game.musicBox-=2;
        document.getElementById('music-bar').style.width=Math.max(0,game.musicBox)+"%";
        if(game.musicBox<=0)die("PUPPET");
    }

    if(!game.light)game.foxyDist+=Math.random()*8;
    else game.foxyDist=Math.max(0,game.foxyDist-20);

    document.getElementById('foxy').style.transform=`scale(${.05+game.foxyDist/80})`;
    if(game.foxyDist>120)die("FOXY");

    if(game.bonniePos===0&&Math.random()>.92)game.bonniePos=1;
    else if(game.bonniePos===1&&Math.random()>.85)game.bonniePos=2;

    if(game.bonniePos===2&&!game.bonnieAttacking){
        document.getElementById('bonnie-office').style.display="block";
        if(!game.mask){
            game.bonnieAttacking=true;
            setTimeout(()=>{
                if(!game.mask&&game.active)die("BONNIE");
                game.bonnieAttacking=false;
            },3000);
        }
    }

    if(game.mask&&game.bonniePos===2){
        game.bonniePos=0;
        game.bonnieAttacking=false;
        document.getElementById('bonnie-office').style.display="none";
    }

    updateCam();
}

function die(enemy){
    if(!game.active)return;
    game.active=false;
    const j=document.getElementById('jumpscare');
    j.style.display="flex";

    if(enemy==="BONNIE"){
        j.innerHTML=`<video autoplay playsinline>
            <source src="video/bonnie_morte.mp4" type="video/mp4">
        </video>`;
    }else{
        j.innerHTML=`<img src="https://media.giphy.com/media/oEI9uWUznW3pS/giphy.gif">`;
    }

    setTimeout(()=>location.reload(),4500);
}

function toggleMask(){
    if(game.mon)return;
    game.mask=!game.mask;
    document.getElementById('mask-layer').style.opacity=game.mask?1:0;
    if(game.mask){
        game.light=false;
        document.getElementById('flashlight').style.opacity=0;
    }
}

function toggleMonitor(){
    if(game.mask)return;
    game.mon=!game.mon;
    document.getElementById('monitor-screen').style.bottom=game.mon?0:'-100%';
    updateCam();
}

function switchCam(n){
    game.currentCam=n;
    document.querySelectorAll('.cam-btn').forEach((b,i)=>b.classList.toggle('cam-active',i+1===n));
    updateCam();
}

function updateCam(){
    document.getElementById('cam-img').style.display=game.currentCam===1?"block":"none";
    document.getElementById('duto-vazio').style.display=(game.currentCam===2&&game.bonniePos!==1)?"block":"none";
    document.getElementById('bonnie-video').style.display=(game.currentCam===2&&game.bonniePos===1)?"block":"none";
}

function windMusic(v){
    if(!game.mon)return;
    game.winding=v;
    if(v&&game.musicBox<100)game.musicBox+=6;
}

function moveOffice(e){
    if(game.mon)return;
    let x=(e.clientX/window.innerWidth)*40-20;
    document.getElementById('office-wrapper').style.transform=`translateX(${-x}vw)`;
    let f=document.getElementById('flashlight');
    f.style.left=e.clientX-260+'px';
    f.style.top=e.clientY-260+'px';
}

window.onkeydown=e=>{
    if(e.code==="Space"&&!game.mask){
        game.light=true;
        document.getElementById('flashlight').style.opacity=1;
        document.getElementById('foxy').style.filter="brightness(1)";
    }
    if(e.key==="m"||e.key==="M")toggleMask();
    if(e.code==="Tab"){e.preventDefault();toggleMonitor();}
};

window.onkeyup=e=>{
    if(e.code==="Space"){
        game.light=false;
        document.getElementById('flashlight').style.opacity=0;
        document.getElementById('foxy').style.filter="brightness(0)";
    }
};
</script>

</body>
</html>
